<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMBLE_CORE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --bg: #0a0a0a;
            --panel-bg: #111111;
            --fg: #ffcc00;
            --fg-dim: #665200;
            --border: 1px solid #443300;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #lock-screen {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            border: var(--border);
            padding: 40px;
            width: 550px;
            background: var(--panel-bg);
        }

        .auth-title {
            font-size: 1.4rem;
            letter-spacing: 3px;
            margin-bottom: 15px;
            color: var(--fg);
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .boot-seq {
            font-size: 0.8rem;
            color: var(--fg-dim);
            height: 75px;
            overflow: hidden;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .pass-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pass-row {
            display: flex;
            align-items: center;
            background: #1a1a1a;
            border: var(--border);
            padding: 12px 18px;
        }

        .prompt-symbol { margin-right: 15px; font-weight: bold; color: var(--fg); }
        
        input[type="password"] {
            background: transparent;
            border: none;
            color: var(--fg);
            font-size: 1.2rem;
            outline: none;
            width: 100%;
            letter-spacing: 4px;
        }

        .pass-dots {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 5px;
        }

        .pass-dot {
            width: 10px;
            height: 10px;
            border: 1px solid var(--fg-dim);
            background: transparent;
        }
        .pass-dot.active {
            background: var(--fg);
            border-color: var(--fg);
        }

        #app {
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 15px;
            gap: 12px;
            display: none;
        }
        #app.active { 
            display: flex; 
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: var(--border);
            padding: 12px 25px;
            background: var(--panel-bg);
        }

        .brand { font-size: 1.4rem; letter-spacing: 3px; font-weight: bold; color: var(--fg); }
        .top-controls { display: flex; gap: 20px; align-items: center; font-size: 0.9rem; }

        .btn-discord {
            background: #1a1a1a;
            border: var(--border);
            color: var(--fg);
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            text-decoration: none;
            letter-spacing: 1px;
        }
        .btn-discord:hover {
            background: var(--fg);
            color: #000;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 12px;
            flex-grow: 1;
            min-height: 0;
        }

        .panel {
            border: var(--border);
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
        }

        .panel-head {
            background: #1a1a1a;
            border-bottom: var(--border);
            color: var(--fg);
            padding: 10px 15px;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 2px;
            display: flex;
            justify-content: space-between;
        }

        .panel-body { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }

        .widget {
            border: 1px solid var(--border);
            background: #151515;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .widget-title { font-size: 0.75rem; color: var(--fg-dim); letter-spacing: 1px; }
        .widget-val { font-size: 1.2rem; font-weight: bold; color: var(--fg); }
        .bar-outer { height: 6px; background: #000; border: 1px solid var(--border); width: 100%; }
        .bar-inner { height: 100%; background: var(--fg); width: 0%; }

        textarea {
            background: #000;
            border: var(--border);
            color: var(--fg);
            width: 100%;
            height: 75px;
            padding: 10px;
            resize: none;
            outline: none;
            font-size: 0.95rem;
        }
        textarea:focus { border-color: var(--fg); }

        .btn-cyber {
            background: #1a1a1a;
            color: var(--fg);
            border: var(--border);
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 2px;
            font-size: 0.8rem;
        }
        .btn-cyber:hover {
            background: var(--fg);
            color: #000;
        }

        .output-container {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .output-box {
            word-break: break-all;
            font-size: 0.85rem;
            color: var(--fg);
            min-height: 70px;
            max-height: 100px;
            overflow-y: auto;
            border: var(--border);
            padding: 10px;
            background: #000;
            line-height: 1.4;
        }

        .btn-copy {
            background: #1a1a1a;
            border: var(--border);
            border-top: none;
            color: var(--fg);
            padding: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .btn-copy:hover {
            background: var(--fg);
            color: #000;
        }

        .error-text { color: #ff3333 !important; border-color: #ff3333 !important; }
        
        .terminal-log-extended {
            font-size: 0.7rem;
            color: var(--fg-dim);
            line-height: 1.4;
            height: 100%;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="auth-card" id="auth-card">
            <div class="auth-title">
                <span>GAMBLE // AUTH</span>
                <a href="https://discord.gg/KEAJwqudQK" target="_blank" class="btn-discord">DISCORD PASS</a>
            </div>
            <div class="boot-seq" id="boot-seq">
                &gt; SYSTEM READY...<br>
                &gt; TARGET KEY: gamble...<br>
                &gt; ENTER PASSWORD TO CONTINUE...
            </div>
            <div class="pass-container">
                <div class="pass-row">
                    <span class="prompt-symbol">KEY://</span>
                    <input type="password" id="pass-input" maxlength="12" autofocus placeholder="••••••••">
                </div>
                <div class="pass-dots" id="pass-dots">
                    <div class="pass-dot"></div>
                    <div class="pass-dot"></div>
                    <div class="pass-dot"></div>
                    <div class="pass-dot"></div>
                    <div class="pass-dot"></div>
                    <div class="pass-dot"></div>
                    <div class="pass-dot"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="app">
        <div class="top-bar">
            <div class="brand">GAMBLE GMBH</div>
            <div class="top-controls">
                <div>SYS_TIME: <span id="clock">00:00:00</span></div>
            </div>
        </div>

        <div class="main-grid">
            <div class="panel">
                <div class="panel-head">SYS_TELEMETRY</div>
                <div class="panel-body">
                    <div class="widget">
                        <div class="widget-title">CPU_LOAD</div>
                        <div class="widget-val" id="cpu-val">0%</div>
                        <div class="bar-outer"><div class="bar-inner" id="cpu-bar"></div></div>
                    </div>
                    <div class="widget">
                        <div class="widget-title">RAM_USAGE</div>
                        <div class="widget-val" id="ram-val">0.0 GB</div>
                        <div class="bar-outer"><div class="bar-inner" id="ram-bar"></div></div>
                    </div>
                </div>
            </div>

            <div style="display: grid; grid-template-rows: 1fr 1fr; gap: 12px; min-height: 0;">
                <div class="panel">
                    <div class="panel-head">
                        <span>[01] ENCRYPT</span>
                        <span>AES-256</span>
                    </div>
                    <div class="panel-body">
                        <textarea id="encrypt-input" placeholder="&gt; ENTER PLAINTEXT..."></textarea>
                        <button class="btn-cyber" onclick="processEncrypt()">EXECUTE_ENCRYPT</button>
                        <div style="font-size: 0.75rem; color: var(--fg-dim);">OUTPUT:</div>
                        <div class="output-container">
                            <div class="output-box" id="encrypt-output">_</div>
                            <button class="btn-copy" onclick="copyToClipboard('encrypt-output', this)">COPY</button>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-head">
                        <span>[02] DECRYPT</span>
                        <span>REVERSE</span>
                    </div>
                    <div class="panel-body">
                        <textarea id="decrypt-input" placeholder="&gt; ENTER CIPHERTEXT..."></textarea>
                        <button class="btn-cyber" onclick="processDecrypt()">EXECUTE_DECRYPT</button>
                        <div style="font-size: 0.75rem; color: var(--fg-dim);">OUTPUT:</div>
                        <div class="output-container">
                            <div class="output-box" id="decrypt-output">_</div>
                            <button class="btn-copy" onclick="copyToClipboard('decrypt-output', this)">COPY</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-head">GLOBAL_FEED</div>
                <div class="panel-body">
                    <div class="widget">
                        <div class="widget-title">FIREWALL</div>
                        <div style="font-size: 0.9rem; color: var(--fg);">ACTIVE</div>
                    </div>
                    <div class="widget" style="flex-grow: 1; overflow: hidden; background: #000; border:var(--border);">
                        <div class="widget-title" style="margin-bottom: 6px; border-bottom: 1px solid var(--border); padding-bottom:3px;">PACKET_STREAM</div>
                        <div id="traffic-stream" class="terminal-log-extended"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const passInput = document.getElementById('pass-input');
        passInput.addEventListener('input', () => {
            const len = passInput.value.length;
            const dots = document.querySelectorAll('.pass-dot');
            dots.forEach((dot, idx) => {
                if (idx < len) dot.classList.add('active');
                else dot.classList.remove('active');
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.target.id === 'pass-input') verifyPass();
        });

        const MASTER_PASS = "Gamble";
        let isUnlocked = false;

        function verifyPass() {
            if (passInput.value === MASTER_PASS) {
                isUnlocked = true;
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('app').classList.add('active');
            } else {
                passInput.value = "";
                passInput.placeholder = "DENIED";
                document.querySelectorAll('.pass-dot').forEach(d => d.classList.remove('active'));
                setTimeout(() => { passInput.placeholder = "••••••••"; }, 500);
            }
        }

        const MAP_3X = {
            '0': '7/!', '1': '0§&', '2': '9)?', '3': '4!$',
            '4': '1(=', '5': '8?(', '6': '3/§', '7': '6&=',
            '8': '2!/', '9': '5§?', 'a': '0)=', 'b': '4!/',
            'c': '8&$', 'd': '1?(', 'e': '7/=', 'f': '3§!'
        };
        const REVERSE_MAP_3X = {};
        for (let key in MAP_3X) REVERSE_MAP_3X[MAP_3X[key]] = key;

        async function getCryptoKey() {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(MASTER_PASS), { name: "PBKDF2" }, false, ["deriveKey"]);
            return crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: enc.encode("GAMBLE_SALT"), iterations: 10000, hash: "SHA-256" },
                keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
            );
        }

        function bufferToHex(buffer) { return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join(''); }
        function hexToBuffer(hexString) {
            const bytes = new Uint8Array(Math.ceil(hexString.length / 2));
            for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hexString.substr(i * 2, 2), 16);
            return bytes;
        }

        async function encryptData(text) {
            const key = await getCryptoKey();
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encoded = new TextEncoder().encode(text);
            const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, encoded);
            const combined = new Uint8Array(iv.length + ciphertext.byteLength);
            combined.set(iv, 0); combined.set(new Uint8Array(ciphertext), iv.length);
            const hex = bufferToHex(combined);
            let ultraPayload = "";
            for (let i = 0; i < hex.length; i++) ultraPayload += MAP_3X[hex[i]] || "";
            return ultraPayload;
        }

        async function decryptData(ultraCipher) {
            try {
                const cleanInput = ultraCipher.trim();
                let hex = "";
                for (let i = 0; i < cleanInput.length; i += 3) {
                    const token = cleanInput.substr(i, 3);
                    if (REVERSE_MAP_3X[token]) hex += REVERSE_MAP_3X[token];
                }
                if (!hex || hex.length < 24) throw new Error("INVALID");
                const combined = hexToBuffer(hex);
                const iv = combined.slice(0, 12);
                const ciphertext = combined.slice(12);
                const key = await getCryptoKey();
                const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ciphertext);
                return new TextDecoder().decode(decrypted);
            } catch (e) { return "[ERROR: CORRUPT]"; }
        }

        function copyToClipboard(elementId, btnElement) {
            const text = document.getElementById(elementId).innerText;
            if (!text || text === "_" || text.startsWith("[ERROR")) return;
            navigator.clipboard.writeText(text).then(() => {
                const orig = btnElement.innerText;
                btnElement.innerText = "OK";
                setTimeout(() => { btnElement.innerText = orig; }, 1000);
            });
        }

        async function processEncrypt() {
            const input = document.getElementById('encrypt-input').value;
            if (!input.trim()) return;
            const res = await encryptData(input);
            const el = document.getElementById('encrypt-output');
            el.innerText = res;
            el.classList.remove('error-text');
        }

        async function processDecrypt() {
            const input = document.getElementById('decrypt-input').value;
            if (!input.trim()) return;
            const res = await decryptData(input);
            const el = document.getElementById('decrypt-output');
            el.innerText = res;
            if(res.includes("ERROR")) el.classList.add('error-text');
            else el.classList.remove('error-text');
        }

        // Extrem sparsamer Ticker (nur alle 2 Sekunden)
        setInterval(() => {
            if (!isUnlocked) return;
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('de-DE');
            
            const cpu = Math.floor(Math.random() * 10 + 5);
            document.getElementById('cpu-val').innerText = cpu + "%";
            document.getElementById('cpu-bar').style.width = cpu + "%";
            const ram = (4.0 + Math.random() * 0.1).toFixed(2);
            document.getElementById('ram-val').innerText = ram + " GB";
            document.getElementById('ram-bar').style.width = (ram / 16 * 100) + "%";

            const stream = document.getElementById('traffic-stream');
            const line = document.createElement('div');
            line.innerText = `0x${Math.floor(Math.random()*999999).toString(16).toUpperCase()} // OK`;
            stream.prepend(line);
            if(stream.children.length > 4) stream.removeChild(stream.lastChild);
        }, 2000);
    </script>
</body>
</html>
