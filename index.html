<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMBLE_CORE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --bg: #030303;
            --panel-bg: rgba(8, 8, 8, 0.96);
            --fg: #c5a059; /* Edles, dezentes Gold */
            --fg-bright: #e2b96d; /* Helles Gold für Highlights */
            --fg-dim: #604d22; /* Gedimmtes Gold */
            --border: 1px solid rgba(197, 160, 89, 0.25);
            --glow: 0 0 10px rgba(197, 160, 89, 0.08);
            --glow-alert: 0 0 20px rgba(255, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.3),
                rgba(0, 0, 0, 0.3) 1px,
                transparent 1px,
                transparent 2px
            );
            z-index: 999;
            pointer-events: none;
        }

        #bg-canvas {
            position: absolute;
            inset: 0;
            z-index: 1;
            opacity: 0.12;
        }

        #lock-screen {
            position: fixed;
            inset: 0;
            background: #030303;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease;
        }

        .auth-card {
            border: var(--border);
            box-shadow: var(--glow);
            padding: 50px;
            width: 650px;
            background: var(--panel-bg);
            position: relative;
        }

        .auth-title {
            font-size: 1.6rem;
            letter-spacing: 5px;
            margin-bottom: 20px;
            color: var(--fg-bright);
            border-bottom: 1px dashed var(--fg-dim);
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Der neue, große, zentrierte Button */
        .gamble-main-btn {
            background: transparent;
            border: 2px solid var(--fg-bright);
            color: var(--fg-bright);
            padding: 30px 60px;
            font-size: 2rem;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 5px;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            text-shadow: 0 0 10px var(--fg-bright);
            box-shadow: 0 0 30px rgba(226, 185, 109, 0.3);
            
            /* Positionierung */
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000; /* Über allem anderen */
        }
        .gamble-main-btn:hover {
            background: var(--fg-bright);
            color: var(--bg);
            box-shadow: 0 0 50px rgba(226, 185, 109, 0.5);
        }

        .boot-seq {
            font-size: 0.85rem;
            color: var(--fg-dim);
            height: 105px;
            overflow: hidden;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .pass-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .pass-row {
            display: flex;
            align-items: center;
            background: rgba(197, 160, 89, 0.02);
            border: 1px solid var(--fg-dim);
            padding: 16px 20px;
            transition: border-color 0.2s;
        }

        .pass-row:focus-within {
            border-color: var(--fg-bright);
        }

        .prompt-symbol { margin-right: 15px; font-weight: bold; color: var(--fg-bright); }
        
        input[type="password"], input[type="text"] {
            background: transparent;
            border: none;
            color: var(--fg-bright);
            font-size: 1.4rem;
            outline: none;
            width: 100%;
            letter-spacing: 6px;
        }

        .pass-dots {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 5px;
        }

        .pass-dot {
            width: 12px;
            height: 12px;
            border: 1px solid var(--fg-dim);
            background: transparent;
            transition: background 0.2s, border-color 0.2s;
        }
        .pass-dot.active {
            background: var(--fg-bright);
            border-color: var(--fg-bright);
        }

        #app {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            gap: 15px;
            opacity: 0;
            transform: scale(0.99) translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        #app.active { opacity: 1; transform: scale(1) translateY(0); }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: var(--border);
            padding: 15px 30px;
            background: var(--panel-bg);
            box-shadow: var(--glow);
        }

        .brand { font-size: 1.6rem; letter-spacing: 5px; font-weight: bold; display: flex; align-items: center; gap: 15px; color: var(--fg-bright); }
        .top-controls { display: flex; gap: 25px; align-items: center; font-size: 1rem; }

        .btn-toggle {
            background: transparent;
            border: 1px solid var(--fg);
            color: var(--fg);
            padding: 8px 18px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: background 0.2s, color 0.2s;
        }
        .btn-toggle:hover { background: var(--fg); color: var(--bg); }

        .main-grid {
            display: grid;
            grid-template-columns: 340px 1fr 340px;
            gap: 15px;
            flex-grow: 1;
            min-height: 0;
        }

        .panel {
            border: var(--border);
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
            box-shadow: var(--glow);
        }

        .panel-head {
            background: rgba(197, 160, 89, 0.05);
            border-bottom: var(--border);
            color: var(--fg-bright);
            padding: 12px 20px;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 3px;
            display: flex;
            justify-content: space-between;
        }

        .panel-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }

        .widget {
            border: 1px dashed var(--fg-dim);
            background: rgba(0,0,0,0.4);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .widget-title { font-size: 0.85rem; color: var(--fg-dim); letter-spacing: 2px; }
        .widget-val { font-size: 1.5rem; font-weight: bold; color: var(--fg-bright); }
        .bar-outer { height: 8px; background: #000; border: 1px solid var(--fg-dim); width: 100%; }
        .bar-inner { height: 100%; background: var(--fg); width: 0%; transition: width 0.2s linear; }

        textarea {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--fg-dim);
            color: var(--fg-bright);
            width: 100%;
            height: 95px;
            padding: 14px;
            resize: none;
            outline: none;
            font-size: 1.1rem;
            transition: border-color 0.2s;
            letter-spacing: 2px;
        }
        textarea:focus { border-color: var(--fg-bright); }

        .btn-cyber {
            background: transparent;
            color: var(--fg);
            border: 1px solid var(--fg);
            padding: 14px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 4px;
            font-size: 0.95rem;
            transition: background 0.15s, color 0.15s;
        }
        .btn-cyber:hover {
            background: var(--fg);
            color: var(--bg);
        }
        .btn-cyber:active { transform: scale(0.99); }

        .output-container {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .output-box {
            word-break: break-all;
            font-size: 1rem;
            color: var(--fg-bright);
            min-height: 90px;
            max-height: 130px;
            overflow-y: auto;
            border: 1px solid var(--fg-dim);
            padding: 14px;
            background: #000;
            line-height: 1.5;
            letter-spacing: 2px;
        }

        .btn-copy {
            background: rgba(197, 160, 89, 0.05);
            border: 1px solid var(--fg);
            border-top: none;
            color: var(--fg);
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 3px;
            transition: background 0.2s, color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-copy:hover {
            background: var(--fg);
            color: var(--bg);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .shake { animation: shake 0.2s ease-in-out; }

        .hidden { display: none !important; }
        .error-text { color: #ff6b6b !important; background: #200000 !important; border-color: #ff4d4d !important; }
        
        .terminal-log-extended {
            font-size: 0.75rem;
            color: var(--fg-dim);
            line-height: 1.5;
            height: 100%;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <!-- Der neue, große, zentrierte Button, der als Link fungiert -->
    <a href="https://www.gamble-gmbh.de/geheimsprache-uebersetzer" target="_blank" class="gamble-main-btn">
        GAMBLE GMBH
    </a>

    <!-- Der "Lock-Screen" (Passwort-Eingabe) -->
    <div id="lock-screen">
        <div class="auth-card" id="auth-card">
            <div class="auth-title">
                <span>GAMBLE // AUTH</span>
            </div>
            <div class="boot-seq" id="boot-seq">
                &gt; INITIALIZING GAMBLE MATRIX...<br>
                &gt; TARGET KEY: gamble REQUIRED...<br>
                &gt; AWAITING OVERRIDE SEQUENCE...
            </div>
            <div class="pass-container">
                <div class="pass-row">
                    <span class="prompt-symbol">KEY://</span>
                    <input type="password" id="pass-input" maxlength="12" autofocus placeholder="••••••••">
                </div>
                <div class="pass-dots" id="pass-dots">
                    <div class="pass-dot"></div>
                    <div class="pass-dot"></div>
                    <div class="pass-dot"></div>
                    <div class="pass-dot"></div>
                    <div class="pass-dot"></div>
                    <div class="pass-dot"></div>
                    <div class="pass-dot"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Das Haupt-Panel (wird nach Login sichtbar) -->
    <div id="app">
        
        <div class="top-bar">
            <div class="brand">
                <span style="display:inline-block; width:14px; height:14px; background:var(--fg-bright);"></span>
                GAMBLE CORE
            </div>
            <div class="top-controls">
                <div>SYS_TIME: <span id="clock" style="color:var(--fg-bright); font-weight: bold;">00:00:00:000</span></div>
                <button class="btn-toggle" id="sound-btn" onclick="toggleSFX()">
