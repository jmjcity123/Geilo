<!DOCTYPE html>

<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAMBLE_CORE // WHITE_EDITION</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');


        :root {

            --bg: #030303;

            --panel-bg: rgba(10, 10, 10, 0.85);

            --fg: #ffffff;

            --fg-dim: #777777;

            --border: 1px solid rgba(255, 255, 255, 0.2);

            --glow: 0 0 10px rgba(255, 255, 255, 0.4);

            --glow-strong: 0 0 20px rgba(255, 255, 255, 0.7);

        }


        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

            font-family: 'Share Tech Mono', monospace;

            text-transform: uppercase;

            user-select: none;

        }


        body {

            background-color: var(--bg);

            color: var(--fg);

            height: 100vh;

            width: 100vw;

            overflow: hidden;

            display: flex;

            flex-direction: column;

        }


        #matrix-canvas {

            position: fixed;

            top: 0;

            left: 0;

            width: 100vw;

            height: 100vh;

            z-index: 1;

            opacity: 0.15;

            pointer-events: none;

        }


        #lock-screen {

            position: fixed;

            inset: 0;

            background: rgba(3, 3, 3, 0.95);

            backdrop-filter: blur(8px);

            z-index: 1000;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

        }


        .auth-card {

            border: var(--border);

            padding: 40px;

            width: 550px;

            background: var(--panel-bg);

            box-shadow: var(--glow-strong);

            position: relative;

            clip-path: polygon(0 0, 95% 0, 100% 10%, 100% 100%, 5% 100%, 0 90%);

        }


        .auth-title {

            font-size: 1.4rem;

            letter-spacing: 3px;

            margin-bottom: 15px;

            color: var(--fg);

            text-shadow: var(--glow);

            border-bottom: var(--border);

            padding-bottom: 12px;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .boot-seq {

            font-size: 0.8rem;

            color: var(--fg-dim);

            height: 75px;

            overflow: hidden;

            margin-bottom: 20px;

            line-height: 1.5;

        }


        .pass-container {

            display: flex;

            flex-direction: column;

            gap: 12px;

        }


        .pass-row {

            display: flex;

            align-items: center;

            background: rgba(255, 255, 255, 0.03);

            border: var(--border);

            padding: 12px 18px;

            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.05);

        }


        .prompt-symbol { margin-right: 15px; font-weight: bold; color: var(--fg); text-shadow: var(--glow); }

        

        input[type="password"] {

            background: transparent;

            border: none;

            color: var(--fg);

            font-size: 1.2rem;

            outline: none;

            width: 100%;

            letter-spacing: 4px;

        }


        .pass-dots {

            display: flex;

            gap: 10px;

            justify-content: center;

            margin-top: 5px;

        }


        .pass-dot {

            width: 10px;

            height: 10px;

            border: 1px solid var(--fg-dim);

            background: transparent;

            transform: rotate(45deg);

            transition: 0.2s;

        }

        .pass-dot.active {

            background: var(--fg);

            border-color: var(--fg);

            box-shadow: var(--glow);

        }


        #app {

            position: relative;

            z-index: 2;

            display: flex;

            flex-direction: column;

            height: 100vh;

            padding: 15px;

            gap: 12px;

            display: none;

        }

        #app.active { 

            display: flex; 

        }


        .top-bar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            border: var(--border);

            padding: 12px 25px;

            background: var(--panel-bg);

            box-shadow: var(--glow);

        }


        .brand { font-size: 1.4rem; letter-spacing: 3px; font-weight: bold; color: var(--fg); text-shadow: var(--glow); }

        .top-controls { display: flex; gap: 20px; align-items: center; font-size: 0.9rem; }


        .btn-discord {

            background: rgba(255, 255, 255, 0.05);

            border: var(--border);

            color: var(--fg);

            padding: 6px 12px;

            cursor: pointer;

            font-size: 0.75rem;

            font-weight: bold;
